apiVersion: apps/v1
kind: Deployment
metadata:
  name: friend-finder-frontend-deployment
  labels:
    app: friend-finder-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: friend-finder-frontend
  template:
    metadata:
      labels:
        app: friend-finder-frontend
    spec:
      containers:
      - name: frontend
        image: ttl.sh/friend_finder/frontend:v9.9.3
        ports:
          - containerPort: 3000
        env:
        - name: BACKEND_BASE_URL
          value: "http://backend-service:8006"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: friend-finder-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP


#ingress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: friends.new.nkit.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

  tls:
    - hosts:
        - friends.new.nkit.dev
      secretName: tls-secret-new

